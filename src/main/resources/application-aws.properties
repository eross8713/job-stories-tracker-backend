# AWS-specific runtime profile (used by our ECS deployments)
spring.profiles.active=aws

# Use in-memory H2 to keep infra simple for recruiter demo
spring.datasource.url=jdbc:h2:mem:jobstories;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Disable Kafka auto-configuration so missing Kafka doesn't break startup on AWS
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Server
server.port=8080

# Management / health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.org.springframework=INFO

